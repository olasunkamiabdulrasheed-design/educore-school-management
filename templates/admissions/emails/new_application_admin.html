<div style="font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 24px; background: #f8fafc;">
    <div style="background: #2563eb; padding: 16px; border-radius: 8px 8px 0 0; text-align: center;">
        <span style="color: white; font-size: 18px; font-weight: bold;">🔔 New Admission Application</span>
    </div>
    <div style="background: white; padding: 24px; border-radius: 0 0 8px 8px;">
        <p style="font-size: 15px; color: #1e293b;">
            <strong>{{ application.first_name }} {{ application.last_name }}</strong> has submitted an application.
        </p>
        <p style="font-size: 14px; color: #64748b;">
            Reference: <strong>{{ application.reference }}</strong><br>
            Applying for: <strong>{{ application.applying_for }}</strong>
        </p>
        <a href="{{ review_url }}" style="display: inline-block; margin-top: 16px; background: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 14px;">
            View Application
        </a>
    </div>
</div>
